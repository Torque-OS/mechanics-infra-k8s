name: CI/CD — mechanics-infra-k8s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
  TF_VAR_enable_datadog: ${{ secrets.DATADOG_API_KEY != '' && (vars.ENABLE_DATADOG || 'true') || 'false' }}
  TF_VAR_datadog_site: ${{ vars.DATADOG_SITE || 'datadoghq.com' }}
  TF_VAR_datadog_namespace: ${{ vars.DATADOG_NAMESPACE || 'datadog' }}
  TF_VAR_datadog_release_name: ${{ vars.DATADOG_RELEASE_NAME || 'datadog-agent' }}

jobs:
  validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: .

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform Validate
        run: terraform validate
        working-directory: .

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        working-directory: .

  apply:
    name: Terraform Apply
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: .

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var="enable_datadog=false"
        working-directory: .

      - name: Terraform Apply - Install Datadog via Helm
        if: env.TF_VAR_enable_datadog == 'true'
        run: terraform apply -auto-approve -input=false
        working-directory: .

      - name: Print cluster name
        run: terraform output cluster_name
        working-directory: .
